<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0e10">
<title>Live preview. Glass Hour</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script type="module" src="/src/v2/preview.js"></script>
</head>
<body class="lp">
<header class="lp-bar">
  <a class="lp-back" href="/staging-v2/catalog/?c=template" aria-label="Back to the shelf"><svg viewBox="0 0 14 18" aria-hidden="true"><path d="M1 1h12L7 8.4z M7 9.6 13 17H1z" fill="#ffb53e"/></svg><span>The shelf</span></a>
  <div class="lp-what">
    <strong id="lp-name"></strong>
    <label class="lp-pick"><span class="sr">Page</span><select id="lp-page" aria-label="Page of the template"></select></label>
  </div>
  <div class="lp-sizes" id="lp-sizes" role="group" aria-label="Screen size">
    <button type="button" data-w="0" aria-pressed="true" aria-label="Desktop"><svg viewBox="0 0 20 16" aria-hidden="true"><rect x="1" y="1" width="18" height="11" rx="1.5"/><path d="M7 15h6"/></svg></button>
    <button type="button" data-w="820" aria-pressed="false" aria-label="Tablet"><svg viewBox="0 0 14 18" aria-hidden="true"><rect x="1" y="1" width="12" height="16" rx="2"/></svg></button>
    <button type="button" data-w="390" aria-pressed="false" aria-label="Phone"><svg viewBox="0 0 10 18" aria-hidden="true"><rect x="1" y="1" width="8" height="16" rx="2"/></svg></button>
  </div>
  <div class="lp-do">
    <a class="lp-plain" id="lp-open" href="#" target="_blank" rel="noopener">Open by itself</a>
    <a class="pill" id="lp-ask" href="#">Ask for this template</a>
  </div>
</header>
<main class="lp-stage" id="lp-stage">
  <div class="lp-frame" id="lp-frame"><iframe id="lp-view" title="Live preview of the template"></iframe></div>
  <p class="lp-none" id="lp-none" hidden>That template is not on the shelf. <a href="/staging-v2/catalog/?c=template">See the ones that are.</a></p>
</main>
</body>
</html>
